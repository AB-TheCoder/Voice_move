name: vccn
description: A press-and-hold, voice-controlled chess clock with many other features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  # On-device speech recognition for the press-and-hold voice pipeline.
  # We're back on this after the Whisper-tiny detour — see prior notes
  # on latency/accuracy tradeoffs. Our _startListeningFor call uses the
  # stable listen(listenFor:, pauseFor:, localeId:) signature directly,
  # not the newer SpeechListenOptions object introduced in 6.6.0, so
  # this should stay compatible across that boundary — but run
  # `flutter pub outdated` and confirm against the current changelog
  # before pinning tighter than this.
  speech_to_text: ^7.0.0
  # PGN share-sheet export (Lichess/chess.com import, Messages, Mail,
  # AirDrop, etc.) via SharePlus.instance.share(ShareParams(...)) —
  # confirmed against the real fluttercommunity/plus_plugins source,
  # not the older deprecated Share.share() static call.
  share_plus: ^13.3.0
  # Move generation/legality/SAN — the actual chess engine.
  # dartchess is pre-1.0 (API can shift between minor versions). Every
  # call site we use (Square.parse, File.fromName, Rank.fromName,
  # legalMoves, isLegal, makeSanUnchecked, isCheckmate, isStalemate,
  # isInsufficientMaterial, halfmoves) has been checked against the
  # `flutter pub outdated` and pin to whatever's actually current
  # rather than trust this number blindly.
  dartchess: ^0.13.1
  # REMOVED: record, path_provider — these were only needed for the
  # abandoned Whisper-tiny audio-capture pipeline (WAV recording to a
  # temp file). Not used anywhere in the current on-device
  # speech_to_text-based clock_screen.dart.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_18pt-Black.ttf
          weight: 900
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

